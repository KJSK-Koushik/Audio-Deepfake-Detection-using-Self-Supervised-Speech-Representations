[project]
name = "audio-deepfake-detection"
version = "0.1.0"
description = "Audio deepfake detection using self-supervised speech representations"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
