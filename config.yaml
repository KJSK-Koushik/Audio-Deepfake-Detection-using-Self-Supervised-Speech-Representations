project:
  name: "Audio Deepfake Detection using Self-Supervised Speech Representations"
  task: "binary_audio_classification"

data:
  dataset_name: "ASVspoof 2019 LA"
  raw_dir: "data/raw/asvspoof2019_la"
  parquet_dir: "data/raw/asvspoof2019_la/huggingface"
  metadata_dir: "data/metadata"
  processed_dir: "data/processed"
  verify_audio_files: true
  labels:
    bonafide: 0
    spoof: 1

audio:
  sample_rate: 16000
  mono: true
  max_duration_seconds: 6.0
  crop_mode: "center"
  pad_value: 0.0

baseline:
  feature_type: "mfcc"
  n_mfcc: 40
  n_mels: 80
  n_fft: 400
  hop_length: 160
  fmin: 20
  fmax: 7600
  classifier: "logistic_regression"
  class_weight: "balanced"
  max_iter: 1000

model:
  ssl_model_name: "microsoft/wavlm-base-plus"
  revision: "a20e37f197dc9d0a2bb65f527b64d64c46f40279"
  num_labels: 2
  classifier_proj_size: 256

wavlm_training:
  epochs: 3
  batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 0.00001
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  freeze_feature_encoder: true
  gradient_checkpointing: true
  num_workers: 2
  log_every_steps: 50

training:
  batch_size: 8
  epochs: 5
  learning_rate: 0.00002
  seed: 42

evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1
    - roc_auc
    - eer
